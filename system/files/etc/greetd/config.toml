[terminal]
# The VT to run the greeter on (Debian's default).
vt = 7

# The default session, also known as the greeter.
[default_session]
# tuigreet: clock, * while typing the password, and only Wayland sessions.
# No --remember options: username and session are asked every time.
# The power menu (F12) calls systemctl, as the greeter's PATH has no sbin.
command = "tuigreet --time --asterisks --sessions /usr/share/wayland-sessions --power-shutdown '/usr/bin/systemctl poweroff' --power-reboot '/usr/bin/systemctl reboot'"

# The user the greeter runs as; Debian's postinst creates it.
user = "_greetd"
