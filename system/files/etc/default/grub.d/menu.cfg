# Show the menu for three seconds, then boot the default entry.
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3

# Draw the menu at 1024x768, which the panel scales up to fill its 2880x1920,
# so the text is bigger; without that mode, GRUB picks one itself. Linux
# starts at the native mode.
GRUB_GFXMODE=1024x768,auto
GRUB_GFXPAYLOAD_LINUX=2880x1920,keep
